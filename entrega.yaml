apiVersion: v1
kind: Namespace
metadata:
  name: ns-cgloria-munoz
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-cgloria-munoz
  namespace: ns-cgloria-munoz
data:
  AMBIENTE: 'produccion-local'
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-cgloria-munoz
  namespace: ns-cgloria-munoz
type: Opaque
data:
  API_KEY: bWktY2xhdmUtc2VjcmV0YS0yMDI2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-cgloria-munoz
  namespace: ns-cgloria-munoz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-cgloria-munoz
  template:
    metadata:
      labels:
        app: app-cgloria-munoz
    spec:
      containers:
        - name: web-app
          image: tu-usuario-dockerhub/tarea-final:3.0.0
          ports:
            - containerPort: 5000
          env:
            - name: AMBIENTE
              valueFrom:
                configMapKeyRef:
                  name: config-cgloria-munoz
                  key: AMBIENTE
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-cgloria-munoz
                  key: API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: svc-cgloria-munoz
  namespace: ns-cgloria-munoz
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
  selector:
    app: app-cgloria-munoz
